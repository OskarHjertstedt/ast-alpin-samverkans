server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        # index.html is served at a fixed URL and changes on every deploy —
        # never cache it long/immutably, or updates won't reach visitors.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
